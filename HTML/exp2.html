<!DOCTYPE html>
<html>
<head>
    <title>Ordered and Unordered Lists</title>
</head>
<body>

    <h2>My Favorite Subjects</h2>

    <!-- Ordered List -->
    <h3>Ordered List</h3>
    <ol>
        <li>Java</li>
        <li>Python</li>
        <li>DBMS</li>
        <li>Web Development</li>
    </ol>

    <!-- Unordered List -->
    <h3>Unordered List</h3>
    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
        <li>React</li>
    </ul>

</body>
</html>
